// Static audit fixtures: HWM is independent of settlement success.
function candidateHwm(d) { return d.totalInvested + d.historicalShareBasis + roundPnl(d); }
function hwmAfter(d) { return d.isFinal && d.order === '—' ? d.hwm : Math.max(d.hwm, candidateHwm(d)); }

function groupMoney(data, amountGetter, currencyGetter) {
    const totals = data.reduce((acc, item) => {
        const currency = currencyGetter(item);
        if (!currency) return acc;
        acc[currency] = (acc[currency] || 0) + amountGetter(item);
        return acc;
    }, {});
    const entries = Object.entries(totals).sort(([a], [b]) => a.localeCompare(b));
    return entries.length ? entries.map(([currency, amount]) => `${amount.toFixed(2)} ${currency}`).join('<br>') : '—';
}

        { label: t('stat_total'), value: totalShare, icon: 'fa-coins', color: 'emerald' },
        { label: t('stat_count'), value: settled.length, icon: 'fa-circle-check', color: 'blue' },
        { label: t('stat_fused'), value: `${triggered} / ${noShare}`, icon: 'fa-scale-balanced', color: 'slate' },
    ];
    document.getElementById('statCards').innerHTML = cards.map(c => `
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-4 flex items-center gap-4">
            <div class="w-10 h-10 rounded-lg bg-${c.color}-50 flex items-center justify-center"><i class="fa-solid ${c.icon} text-${c.color}-500"></i></div>
            <div><p class="text-2xl font-bold text-slate-800 font-mono">${c.value}</p><p class="text-xs text-slate-500">${c.label}</p></div>
        </div>`).join('');
}

function renderTable() {
    const rf = document.getElementById('filterResult').value;
    const settlementStatus = document.getElementById('filterSettlementStatus').value;
    const followerSearch = document.getElementById('filterFollower').value.toLowerCase();
    const masterSearch = document.getElementById('filterMaster').value.toLowerCase();
    const lifecycleSearch = document.getElementById('filterLifecycle').value.toLowerCase();
    const listingPeriodSearch = document.getElementById('filterListingPeriod').value.toLowerCase();
    const timeType = document.getElementById('filterTimeType').value;
    const dateStart = document.getElementById('filterDateStart').value;
    const dateEnd = document.getElementById('filterDateEnd').value;
    let data = mockData.filter(d => {
        if (rf && d.result !== rf) return false;
        if (settlementStatus && d.settlementStatus !== settlementStatus) return false;
        if (followerSearch && !d.follower.toLowerCase().includes(followerSearch)) return false;
        if (masterSearch && !d.master.toLowerCase().includes(masterSearch)) return false;
        if (lifecycleSearch && !d.lifecycleId.toLowerCase().includes(lifecycleSearch)) return false;
        if (listingPeriodSearch && !d.listingPeriod.toLowerCase().includes(listingPeriodSearch)) return false;
        const selectedTime = timeType === 'settlement' ? d.settlementTime : d.time;
        if ((dateStart || dateEnd) && !selectedTime) return false;
        const selectedDate = selectedTime ? selectedTime.slice(0, 10) : '';
        if (dateStart && selectedDate < dateStart) return false;
        if (dateEnd && selectedDate > dateEnd) return false;
        return true;
    });
    renderStatCards(data);
    const resultMeta = {
        profit:  { label: t('result_profit'),  cls: 'bg-emerald-50 text-emerald-700' },
        current_order_not_profitable: { label: t('result_order_loss'), cls: 'bg-slate-100 text-slate-600' },
        stage_loss_not_recovered: { label: t('result_stage_loss'), cls: 'bg-amber-50 text-amber-700' },
        floating_loss_guard: { label: t('result_floating_guard'), cls: 'bg-amber-50 text-amber-700' },
        final_no_share: { label: t('result_final_no_share'), cls: 'bg-slate-100 text-slate-600' },
    };
    const settlementMeta = {
        success: { label: isZh() ? '成功' : 'Success', cls: 'bg-emerald-50 text-emerald-700' },
        pending: { label: isZh() ? '处理中' : 'Pending', cls: 'bg-amber-50 text-amber-700' },
        failed: { label: isZh() ? '失败' : 'Failed', cls: 'bg-rose-50 text-rose-600' },
        not_applicable: { label: '—', cls: 'text-slate-300' },
    };
    document.getElementById('tableBody').innerHTML = data.map(d => {
        const rm = resultMeta[d.result];
        const sm = settlementMeta[d.settlementStatus];
        return `
        <tr class="border-b border-slate-100 hover:bg-slate-50/60 transition-colors">
            <td class="px-4 py-3 font-mono text-xs text-slate-600">${d.txId}</td>
            <td class="px-4 py-3 font-mono text-xs text-primary cursor-pointer hover:underline" onclick="showUidToast('${d.follower}')">${d.follower}</td>
            <td class="px-4 py-3 font-mono text-xs text-primary cursor-pointer hover:underline" onclick="showUidToast('${d.master}')">${d.master}</td>
            <td class="px-4 py-3 font-mono text-xs text-slate-500">${d.lifecycleId}</td>
            <td class="px-4 py-3 font-mono text-xs text-slate-500">Acct.No ${d.acct}</td>
            <td class="px-4 py-3 font-mono text-xs text-slate-500">${d.order}</td>
            <td class="px-4 py-3 text-right font-mono ${d.realizedPnl > 0 ? 'text-emerald-600' : d.realizedPnl < 0 ? 'text-rose-600' : 'text-slate-500'}">${d.isFinal && d.order === '—' ? '—' : signedMoney(d.realizedPnl, d.sourceCurrency)}</td>
            <td class="px-4 py-3 text-right font-mono ${d.result === 'profit' ? 'text-slate-700 font-semibold' : 'text-slate-300'}">${d.result === 'profit' ? `${d.settlementAmount.toFixed(2)} ${d.settlementCurrency}` : '—'}</td>
            <td class="px-4 py-3 text-center"><span class="inline-flex items-center px-2.5 py-1 rounded-md text-[11px] font-bold ${sm.cls}">${sm.label}</span></td>
            <td class="px-4 py-3 text-center"><span class="inline-flex items-center px-2.5 py-1 rounded-md text-[11px] font-bold ${rm.cls}">${rm.label}</span></td>
            <td class="px-4 py-3 font-mono text-xs text-slate-500">${d.time}</td>
            <td class="px-4 py-3 text-center"><button onclick="openDetail('${d.txId}')" class="text-primary hover:underline text-xs font-semibold">${isZh() ? '详情' : 'Details'}</button></td>
        </tr>`;
    }).join('');
}

function roundPnl(d) { return d.stageBefore + d.realizedPnl; }
function shareBase(d) { return d.result === 'profit' ? Math.max(0, roundPnl(d)) : 0; }
function shareAmount(d) { return shareBase(d) * d.rate / 100; }
function stageAfter(d) { return d.result === 'profit' && d.settlementStatus === 'success' ? 0 : roundPnl(d); }
function signedMoney(value, currency) { return `${value > 0 ? '+' : ''}${value.toFixed(2)} ${currency}`; }
function amountMoney(value, currency) { return `${value.toFixed(2)} ${currency}`; }
function cumulativeDeductedAfter(d) {
    if (d.settlementStatus === 'success') return d.historicalDeducted + shareAmount(d);
    return d.historicalDeducted;
}

function openDetail(txId) {
    const d = mockData.find(x => x.txId === txId);
    if (!d) return;
    const title = isZh() ? '分润流水详情' : 'Profit Share Detail';
    const zh = isZh();
    const currency = d.sourceCurrency;
    const resultText = { profit: t('result_profit'), current_order_not_profitable: t('result_order_loss'), stage_loss_not_recovered: t('result_stage_loss'), floating_loss_guard: t('result_floating_guard'), final_no_share: t('result_final_no_share') }[d.result];
    const resultClass = { profit: 'bg-emerald-50 text-emerald-700', current_order_not_profitable: 'bg-slate-100 text-slate-600', stage_loss_not_recovered: 'bg-amber-50 text-amber-700', floating_loss_guard: 'bg-amber-50 text-amber-700', final_no_share: 'bg-slate-100 text-slate-600' }[d.result];
    const settlementMeta = {
        success: { label: zh ? '成功' : 'Success', cls: 'bg-emerald-50 text-emerald-700' },
        pending: { label: zh ? '处理中' : 'Pending', cls: 'bg-amber-50 text-amber-700' },
        failed: { label: zh ? '失败' : 'Failed', cls: 'bg-rose-50 text-rose-600' },
        not_applicable: { label: '—', cls: 'text-slate-300' },
    }[d.settlementStatus];
    const row = (label, value, mono = true) => `<div class="grid grid-cols-[minmax(0,1fr)_minmax(0,1.35fr)] gap-4 py-2.5 border-b border-slate-100 last:border-0"><span class="text-sm text-slate-500">${label}</span><span class="text-sm ${mono ? 'font-mono' : ''} text-slate-800 text-right break-all">${value}</span></div>`;
    const section = (title, content, note = '') => `<section class="mb-6"><div class="flex items-center gap-2 mb-2"><span class="w-1 h-4 rounded-full bg-primary"></span><h3 class="text-sm font-bold text-slate-700">${title}</h3></div><div class="rounded-lg border border-slate-200 px-4 bg-white">${content}</div>${note ? `<p class="mt-2 text-xs leading-5 text-slate-500"><i class="fa-solid fa-circle-info mr-1 text-slate-400"></i>${note}</p>` : ''}</section>`;
    const noShareReason = {
        current_order_not_profitable: zh ? '本笔平仓净盈亏不大于 0；本次净盈亏继续计入阶段性盈亏。' : 'This closing deal was not profitable; its net P/L remains in stage P/L.',
        stage_loss_not_recovered: zh ? '前两步已通过，但本次平仓净盈亏加历史阶段性盈亏不大于 0；尚无可分润的累计利润。' : 'The first two checks passed, but deal net P/L plus prior stage P/L is not positive. No accumulated profit is available to share.',
        floating_loss_guard: zh ? '本次平仓净盈亏加当前持仓浮动盈亏不大于 0，第二步未通过；等于 0 也不分润。浮动盈亏不计入阶段性盈亏或分润基数。' : 'Deal net P/L plus remaining floating P/L is zero or negative, so the second check failed. Floating P/L is not included in stage P/L or the share basis.',
        final_no_share: zh ? '退出最终阶段性盈亏不大于 0，不产生最终分润。' : 'Final stage P/L is not positive, so no final profit share is due.',
    }[d.result] || '';
    const copyable = value => value === '—' ? '—' : `<button type="button" class="text-slate-700 hover:text-primary" onclick="copyAuditValue('${value}')" title="${zh ? '点击复制' : 'Click to copy'}">${value} <i class="fa-regular fa-copy text-xs text-slate-400"></i></button>`;
    const clientLink = uid => `<a class="text-primary hover:underline" href="${zh ? '客户管理.html' : 'clients.html'}?uid=${encodeURIComponent(uid)}">${uid}</a>`;
    const locked = d.result === 'profit' && ['pending', 'failed'].includes(d.settlementStatus);
    const basic = [
        row(zh ? '分润流水编号' : 'Profit Share ID', copyable(d.txId)),
        row(zh ? '跟随生命周期编号' : 'Copy Lifecycle ID', copyable(d.lifecycleId)),
        row(zh ? '跟随者 UID' : 'Follower UID', clientLink(d.follower)),
        row(zh ? '高手 UID' : 'Master UID', clientLink(d.master)),
        row(zh ? '高手上榜周期编号' : 'Master Listing Period ID', d.listingPeriod),
        row(zh ? '跟单账号' : 'Copy Acct.No', copyable(`Acct.No ${d.acct}`)),
        row(zh ? '交易订单号' : 'Trade Order ID', copyable(d.order)),
        row(zh ? '审计类型' : 'Audit Type', d.isFinal ? (zh ? '退出最终分润' : 'Final exit profit share') : (zh ? '普通平仓分润' : 'Regular closing deal'), false),
        row(zh ? '审计创建时间' : 'Audit Created At', d.time),
    ].join('');
    const calculation = [
        row(zh ? '本次平仓净盈亏' : 'Closed Deal Net P/L', d.isFinal && d.order === '—' ? '—' : signedMoney(d.realizedPnl, currency)),
        row(zh ? '分润前阶段性盈亏' : 'Stage P/L Before', signedMoney(d.stageBefore, currency)),
        row(zh ? '本轮累计盈亏' : 'Round P/L', signedMoney(roundPnl(d), currency)),
        row(zh ? '当前持仓浮动盈亏' : 'Remaining Floating P/L', signedMoney(d.floatingPnl, currency)),
        row(zh ? '分润基数' : 'Profit Share Basis', `${shareBase(d).toFixed(2)} ${currency}`),
        row(zh ? '固化分润比例' : 'Locked Profit Share Rate', `${d.rate}%`),
        row(zh ? '应扣分润金额' : 'Profit Share Amount', d.result === 'profit' ? `${shareAmount(d).toFixed(2)} ${currency}` : '—'),
        row(zh ? '分润后阶段性盈亏' : 'Stage P/L After', signedMoney(stageAfter(d), currency) + (locked ? `<small class="block text-amber-700 font-sans">${zh ? '待结算锁定' : 'Locked for settlement'}</small>` : '')),
        row(zh ? '分润判断结果' : 'Profit Share Result', `<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[11px] font-bold ${resultClass}">${resultText}</span>`, false),
    ].join('');
    const watermarks = [
        row(zh ? '更新前高水位' : 'HWM Before', amountMoney(d.hwm, currency)),
        row(zh ? '累计成功投资金额' : 'Total Successful Investment', amountMoney(d.totalInvested, currency)),
        row(zh ? '历史累计成功分润基数' : 'Cumulative Settled Share Basis', amountMoney(d.historicalShareBasis, currency)),
        row(zh ? '本轮累计盈亏' : 'Round P/L', signedMoney(roundPnl(d), currency)),
        row(zh ? '候选高水位' : 'Candidate HWM', d.isFinal && d.order === '—' ? '—' : amountMoney(candidateHwm(d), currency)),
        row(zh ? '更新后高水位' : 'HWM After', amountMoney(hwmAfter(d), currency)),
    ].join('');
    const settlement = [
        row(zh ? '分润前累计已扣分润' : 'Cumulative Share Deducted Before', amountMoney(d.historicalDeducted, currency)),
        row(zh ? '分润后累计已扣分润' : 'Cumulative Share Deducted After', amountMoney(cumulativeDeductedAfter(d), currency)),
        row(zh ? '原始分润' : 'Source Share', d.result === 'profit' ? `${shareAmount(d).toFixed(2)} ${d.sourceCurrency}` : '—'),
        row(zh ? '高手结算币种' : 'Master Settlement Currency', d.result === 'profit' ? d.settlementCurrency : '—'),
        row(zh ? '结算分润' : 'Settlement Share', d.result === 'profit' ? `${d.settlementAmount.toFixed(2)} ${d.settlementCurrency}` : '—'),
        row(zh ? '换汇汇率' : 'FX Rate', d.result === 'profit' ? `${d.fxRate} · ${d.fxTime}` : '—'),
        row(zh ? '入账类型' : 'Entry Type', d.result === 'profit' ? 'Profit Share In' : '—'),
        row(zh ? '资金结算状态' : 'Settlement Status', `<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[11px] font-bold ${settlementMeta.cls}">${settlementMeta.label}</span>`, false),
        row(zh ? 'Funding 流水编号' : 'Funding Ledger ID', copyable(d.ledgerId || '—')),
        row(zh ? '结算时间' : 'Settlement Time', d.settlementTime || '—'),
        d.failureReason ? row(zh ? '失败原因' : 'Failure Reason', zh ? d.failureReason : d.failureReasonEn, false) : '',
    ].join('');
    document.getElementById('detailTitle').textContent = title;
    document.getElementById('detailFootnote').textContent = zh
        ? '本页金额均为历史快照。结算未成功时，阶段性盈亏与分润基数保持锁定；HWM 保留本次平仓的更新结果，重试不重复更新。'
        : 'All amounts are audit snapshots. Stage P/L and the share basis remain locked until settlement succeeds. HWM retains its closing-event result; retries do not update it again.';
    document.getElementById('detailBody').innerHTML = [
        section(zh ? '基础信息' : 'Basic information', basic),
        section(zh ? '本次分润计算' : 'Profit share calculation', calculation, zh ? '普通平仓依次判断：①本次平仓净盈亏 > 0；②本次平仓净盈亏 + 当前持仓浮动盈亏 > 0；③本次平仓净盈亏 + 历史阶段性盈亏 > 0。等于 0 不通过；全部通过时以第三步累计金额分润。成功后阶段性盈亏清零；HWM 独立按平仓更新。退出最终结算只看最终阶段性盈亏。' : 'Regular closes require: (1) deal net P/L > 0; (2) deal net P/L + remaining floating P/L > 0; (3) deal net P/L + prior stage P/L > 0. Zero fails any check. The third amount is the share basis. Successful settlement clears stage P/L. HWM updates independently on closing. Final exit uses final stage P/L.'),
        section(zh ? '高水位记录' : 'HWM record', watermarks, d.isFinal && d.order === '—' ? (zh ? '本次为无新成交的最终检查，沿用上次平仓后的高水位，不重复更新。' : 'No new closing deal: retain the previous closing-event HWM without another update.') : (zh ? '候选高水位 = 累计成功投资金额 + 历史累计成功分润基数 + 本轮累计盈亏。更新后取原水位与候选值较大者；浮动盈亏不参与，分润成功不再次抬高。' : 'Candidate HWM = total successful investment + cumulative settled share basis + round P/L. Keep the higher of the previous HWM and candidate. Floating P/L is excluded; settlement does not raise HWM again.')),
        section(zh ? '结算与入账' : 'Settlement and entry', settlement, d.result !== 'profit' ? noShareReason : ''),
    ].join('');
    document.getElementById('detailDrawer').classList.remove('hidden');
}
function closeDetail() { document.getElementById('detailDrawer').classList.add('hidden'); }

async function copyAuditValue(value) {
    try { await navigator.clipboard.writeText(value); showToast(isZh() ? '已复制' : 'Copied'); }
    catch { showToast(isZh() ? '浏览器暂不支持复制，请手动选择编号复制' : 'Select the ID to copy it manually'); }
}


function showToast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 2500); }

function showUidToast(uid) {
    window.location.href = `${isZh() ? '客户管理.html' : 'clients.html'}?uid=${encodeURIComponent(uid)}`;
}

function init() {
    const lang = LANG();
    injectSidebar({ activePath: isZh() ? 'Copytrading / 分润流水' : 'Copytrading / Profit Share Ledger', lang });
    applyI18n();
    renderTable();
}
init();
</script>
