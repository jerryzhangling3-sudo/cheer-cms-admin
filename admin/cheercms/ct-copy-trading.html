function formatCurrencyTotals(data) {
    const totals = data.reduce((result, item) => {
        result[item.currency] = (result[item.currency] || 0) + item.invest;
        return result;
    }, {});
    const values = Object.entries(totals).map(([currency, value]) => `${value.toLocaleString()} ${currency}`);
    return values.length ? values.join('<br>') : '—';
}

function renderStatCards(data) {
    const pending = data.filter(d => d.status === 'pending');
    const active = data.filter(d => d.status === 'active');
    const closing = data.filter(d => d.status === 'closing');
    const closed = data.filter(d => d.status === 'closed');
    const failed = data.filter(d => d.status === 'failed');
    const totalInvest = formatCurrencyTotals(data.filter(d => ['active', 'closing'].includes(d.status)));
    const cards = [
        { label: t('stat_pending'), value: pending.length, icon: 'fa-clock', color: 'amber' },
        { label: t('stat_active'), value: active.length, icon: 'fa-circle-play', color: 'emerald' },
        { label: t('stat_closing'), value: closing.length, icon: 'fa-spinner', color: 'amber' },
        { label: t('stat_closed'), value: closed.length, icon: 'fa-circle-stop', color: 'slate' },
        { label: t('stat_failed'), value: failed.length, icon: 'fa-circle-xmark', color: 'rose' },
        { label: t('stat_total_invest'), value: totalInvest, icon: 'fa-coins', color: 'blue' },
    ];
    document.getElementById('statCards').innerHTML = cards.map(c => `
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-4 flex items-center gap-4">
            <div class="w-10 h-10 rounded-lg bg-${c.color}-50 flex items-center justify-center"><i class="fa-solid ${c.icon} text-${c.color}-500"></i></div>
            <div><p class="text-2xl font-bold text-slate-800 font-mono">${c.value}</p><p class="text-xs text-slate-500">${c.label}</p></div>
        </div>`).join('');
}

function renderTable() {
    const sf = document.getElementById('filterStatus').value;
    const follower = document.getElementById('filterFollower').value.toLowerCase();
    const master = document.getElementById('filterMaster').value.toLowerCase();
    let data = mockData.filter(d => {
        if (sf && d.status !== sf) return false;
        if (follower && !d.follower.toLowerCase().includes(follower)) return false;
        if (master && !d.master.toLowerCase().includes(master)) return false;
        return true;
    });
    renderStatCards(data);
    const statusMeta = {
        pending: { label: t('status_pending'), cls: 'bg-amber-50 text-amber-700' },
        active:  { label: t('status_active'),  cls: 'bg-emerald-50 text-emerald-700' },
        closing: { label: t('status_closing'), cls: 'bg-amber-50 text-amber-700' },
        closed:  { label: t('status_closed'),  cls: 'bg-slate-100 text-slate-500' },
        failed:  { label: t('status_failed'),  cls: 'bg-rose-50 text-rose-700' },
    };
    document.getElementById('tableBody').innerHTML = data.map(d => {
        const sm = statusMeta[d.status];
        return `
        <tr class="border-b border-slate-100 hover:bg-slate-50/60 transition-colors">
            <td class="px-4 py-3 font-mono text-xs text-slate-600">${d.cycleId}</td>
            <td class="px-4 py-3"><button class="font-mono text-xs text-primary hover:underline" onclick="showUidToast('${d.follower}')">${d.follower}</button><span class="block mt-1 text-xs text-slate-500">${isZh() ? d.followerNickZh : d.followerNick}</span></td>
            <td class="px-4 py-3"><button class="font-mono text-xs text-primary hover:underline" onclick="showUidToast('${d.master}')">${d.master}</button><span class="block mt-1 text-xs text-slate-500">${isZh() ? d.masterNickZh : d.masterNick}</span></td>
            <td class="px-4 py-3 text-right font-mono font-semibold">${d.invest.toLocaleString()} ${d.currency}</td>
            <td class="px-4 py-3 font-mono text-xs text-slate-600">${d.mt5Acct ? `Acct.No ${d.mt5Acct}` : '—'}</td>
            <td class="px-4 py-3 text-right font-mono">${d.lots === null ? '—' : d.lots.toFixed(2)}</td>
            <td class="px-4 py-3 text-right font-mono ${d.pnl === null ? 'text-slate-400' : d.pnl >= 0 ? 'text-emerald-600' : 'text-rose-600'}">${d.pnl === null ? '—' : `${d.pnl >= 0 ? '+' : ''}${d.pnl.toFixed(2)} ${d.currency}`}</td>
            <td class="px-4 py-3 text-right font-mono ${d.stage === null ? 'text-slate-400' : d.stage > 0 ? 'text-emerald-600' : d.stage < 0 ? 'text-rose-600' : 'text-slate-600'}">${d.stage === null ? '—' : `${d.stage > 0 ? '+' : ''}${d.stage.toFixed(2)} ${d.currency}`}</td>
            <td class="px-4 py-3 text-right font-mono text-slate-500">${d.hwm === null ? '—' : `${d.hwm.toFixed(2)} ${d.currency}`}</td>
            <td class="px-4 py-3 text-center"><span class="inline-flex items-center px-2.5 py-1 rounded-md text-[11px] font-bold ${sm.cls}">${sm.label}</span>${d.status === 'closing' ? `<small class="block mt-1 text-[10px] ${d.exitProcessing === 'sweep_failed' ? 'text-rose-600' : 'text-amber-600'}">${d.exitProcessing === 'sweep_failed' ? (isZh() ? '归集失败' : 'Sweep failed') : (isZh() ? '最终结算处理中' : 'Settlement pending')}</small>` : ''}</td>
            <td class="px-4 py-3 font-mono text-xs text-slate-500">${d.start || '—'}</td>
            <td class="px-4 py-3 text-center">
                <div class="flex items-center justify-center gap-1">
                    ${d.status === 'active' ? `<button onclick="openCancelModal(${mockData.indexOf(d)})" class="text-rose-600 hover:underline font-medium text-xs">${t('btn_cancel_invest')}</button>` : ['pending', 'failed'].includes(d.status) ? `<button onclick="openPaymentRecord(${mockData.indexOf(d)})" class="text-primary hover:underline font-medium text-xs">${t('btn_payment_record')}</button>` : '<span class="text-slate-300">—</span>'}
                </div>
            </td>
        </tr>`;
    }).join('');
}

function openPaymentRecord(i) {
    const d = mockData[i];
    if (!d || !['pending', 'failed'].includes(d.status)) return;
    const fn = isZh() ? d.followerNickZh : d.followerNick;
    const mn = isZh() ? d.masterNickZh : d.masterNick;
    const requestContent = `
    <div>
        <h3 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-3">${t('section_info')}</h3>
        <div class="bg-slate-50 rounded-xl p-4 grid grid-cols-2 gap-3 text-sm">
            <div><span class="text-slate-500">${isZh()?'跟随者':'Follower'}</span><p class="font-semibold">${fn} <span class="font-mono text-xs text-slate-400">(${d.follower})</span></p></div>
            <div><span class="text-slate-500">${isZh()?'高手':'Master'}</span><p class="font-semibold">${mn} <span class="font-mono text-xs text-slate-400">(${d.master})</span></p></div>
            <div><span class="text-slate-500">${isZh()?'申请金额':'Requested Amount'}</span><p class="font-mono font-bold text-slate-800">${d.invest.toLocaleString()} ${d.currency}</p></div>
            <div><span class="text-slate-500">${isZh()?'跟随账号':'Copy Account'}</span><p class="font-mono">—</p></div>
        </div>
    </div>
    <div>
        <h3 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-3">${t('section_payment')}</h3>
        <div class="border border-slate-200 rounded-xl overflow-hidden text-sm">
            ${[
              [isZh()?'支付订单 ID':'Payment Order ID', d.paymentOrder],
              [isZh()?'预留金额':'Reserved Capacity', `${d.reserved.toLocaleString()} ${d.currency}`],
              [isZh()?'预留时间':'Reserved At', d.reservedAt],
              [isZh()?'到期时间':'Expires At', d.expiresAt],
              [isZh()?'最近支付尝试':'Last Payment Attempt', d.lastAttempt],
              [isZh()?'支付结果':'Payment Result', isZh() ? d.paymentStatusZh : d.paymentStatusEn],
              ...(d.failureReasonZh ? [[isZh()?'失败原因':'Failure Reason', isZh() ? d.failureReasonZh : d.failureReasonEn], [isZh()?'额度释放时间':'Released At', d.releasedAt]] : []),
            ].map(([label, value]) => `<div class="flex items-start justify-between gap-6 px-4 py-3 border-b border-slate-100 last:border-0"><span class="text-slate-500">${label}</span><strong class="font-mono text-right text-slate-700">${value}</strong></div>`).join('')}
        </div>
        <p class="mt-3 text-xs ${d.status === 'pending' ? 'text-amber-700 bg-amber-50' : 'text-rose-700 bg-rose-50'} rounded-lg px-3 py-2">${d.status === 'pending' ? (isZh()?'预留期间占用客户名额、高手名额及可投资金额；不计入当前投资金额。':'The reservation uses client, follower and capacity limits, but is excluded from current investment.') : (isZh()?'该申请已失败，客户名额、高手名额及预留金额均已释放。':'The request failed. All slot and amount reservations have been released.')}</p>
    </div>`;
    document.getElementById('detailTitle').textContent = t('payment_record');
    document.getElementById('detailContent').innerHTML = requestContent;
    const bd = document.getElementById('detailBackdrop');
    const pn = document.getElementById('detailPanel');
    bd.classList.remove('hidden');
    requestAnimationFrame(() => { bd.classList.add('opacity-100'); pn.classList.add('open'); });
}
function closeDetail() {
    const bd = document.getElementById('detailBackdrop');
    const pn = document.getElementById('detailPanel');
    bd.classList.remove('opacity-100'); pn.classList.remove('open');
    setTimeout(() => bd.classList.add('hidden'), 300);
}

let cancelIdx = -1;
function openCancelModal(i) {
    cancelIdx = i;
    const d = mockData[i];
    document.getElementById('cancelMsg').textContent = isZh() ? `确认取消 ${d.followerNickZh} 对 ${d.masterNickZh} 的投资？` : `Cancel ${d.followerNick}'s investment in ${d.masterNick}?`;
    document.getElementById('cancelModal').classList.remove('hidden');
}
function closeCancelModal() { document.getElementById('cancelModal').classList.add('hidden'); cancelIdx = -1; }
function confirmCancel() {
    if (cancelIdx >= 0) {
        mockData[cancelIdx].status = 'closing';
        renderTable();
    }
    closeCancelModal();
    showToast(t('toast_cancelled'));
}

function showToast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 2500); }

function showUidToast(uid) {
    window.location.href = `${isZh() ? '客户管理.html' : 'clients.html'}?uid=${encodeURIComponent(uid)}`;
}

function init() {
    const lang = LANG();
    injectSidebar({ activePath: isZh() ? 'Copytrading / 跟单管理' : 'Copytrading / Copy Trading', lang });
    applyI18n();
    renderTable();
}
init();
</script>
