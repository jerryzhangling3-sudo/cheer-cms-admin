        const p = PEOPLE[uid];
        if (!p) return `<span class="font-mono text-slate-800">${uid}</span>`;
        return `<div><span class="font-mono text-slate-800">${uid}</span></div><div class="text-slate-500 text-xs mt-0.5">${p.nick}</div>`;
    }
    function statusBadge(status) {
        const m = STATUS_META[status];
        return `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md text-[11px] font-bold tracking-wide border ${m.cls}"><i class="fa-solid ${m.icon} text-[10px]"></i>${m.label}</span>`;
    }
    function levelBadge(lv) {
        return `<span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-bold tracking-wide border ${LEVEL_META[lv] || LEVEL_META.L1}">${lv}</span>`;
    }
    function tierBadge(layer) {
        return `<span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-semibold tracking-wide bg-slate-100 text-slate-600">Tier ${layer}</span>`;
    }

    // ============================ 筛选 & 渲染 ============================

    let currentFilters = {};

    function resetFilters() {
        document.getElementById('f-ib').value = "";
        document.getElementById('f-trader').value = "";
        document.getElementById('f-order').value = "";
        document.getElementById('f-symbol').value = "";
        document.getElementById('f-start').value = "";
        document.getElementById('f-end').value = "";
        document.getElementById('f-status').value = "";
        currentFilters = {};
        renderTable();
    }
    function applyFilters() {
        currentFilters = {
            ibUid:  document.getElementById('f-ib').value.trim(),
            trader: document.getElementById('f-trader').value.trim(),
            order:  document.getElementById('f-order').value.trim(),
            symbol: document.getElementById('f-symbol').value,
            status: document.getElementById('f-status').value,
            start:  document.getElementById('f-start').value,
            end:    document.getElementById('f-end').value
        };
        renderTable();
    }

    function passesFilter(r) {
        const meta = ORDER_META[r.orderId];
        if (currentFilters.ibUid && !r.ibUid.includes(currentFilters.ibUid)) return false;
        if (currentFilters.trader && !meta.traderUid.includes(currentFilters.trader)) return false;
        if (currentFilters.order && !r.orderId.includes(currentFilters.order)) return false;
        if (currentFilters.symbol && meta.symbol !== currentFilters.symbol) return false;
        if (currentFilters.status && currentFilters.status !== 'all' && r.status !== currentFilters.status) return false;
        return true;
    }

    function renderTable() {
        const tbody = document.getElementById('table-body');
        const empty = document.getElementById('empty-state');
        const rows = mockRebates.filter(passesFilter);
        document.getElementById('total-count').textContent = rows.length;

        if (!rows.length) {
            tbody.innerHTML = "";
            empty.classList.remove("hidden-state");
            return;
        }
        empty.classList.add("hidden-state");

        tbody.innerHTML = rows.map(r => {
            const meta = ORDER_META[r.orderId];
            const amtCls = "text-emerald-600";
            const amtStyle = "font-mono font-bold text-right " + amtCls;
            const traderUid = meta.traderUid;

            return `<tr class="hover:bg-slate-50/70 transition-colors" data-order-id="${r.orderId}">
                <td class="px-5 py-4 font-mono text-xs text-slate-700 cursor-pointer hover:underline" onclick="openDetailDrawer('${r.rebateId}')">${r.rebateId}</td>
                <td class="px-5 py-4 font-mono text-xs text-slate-500">${r.settleTime}</td>
                <td class="px-5 py-4 font-mono text-xs text-slate-700 cursor-pointer hover:underline" onclick="highlightOrder('${r.orderId}', event)">${r.orderId}</td>
                <td class="px-5 py-4 text-slate-700"><span class="font-mono">${meta.symbol}</span> · <span class="font-mono">${fmtNum(meta.lots, 2)}</span> lot</td>
                <td class="px-5 py-4 text-slate-700">${personLabel(traderUid)}</td>
                <td class="px-5 py-4 text-slate-700">${personLabel(r.ibUid)}</td>
                <td class="px-5 py-4">${levelBadge(r.level)}</td>
                <td class="px-5 py-4">${tierBadge(r.layer)}</td>
                <td class="px-5 py-4 font-mono text-right text-slate-700">${fmtNum(r.deltaPct, 2)}%</td>
                <td class="px-5 py-4 text-center font-mono text-[12px] font-bold text-slate-700">${r.currency}</td>
                <td class="px-5 py-4 ${amtStyle}">"+${fmtNum(r.netUsd)}</td>
                <td class="px-5 py-4">${statusBadge(r.status)}</td>
                <td class="px-5 py-4 text-center">
                    <button onclick="openDetailDrawer('${r.rebateId}')" class="text-primary hover:underline text-xs">详情</button>
                </td>
            </tr>`;
        }).join("");
    }

    function highlightOrder(orderId, ev) {
        if (ev) ev.stopPropagation();
        document.querySelectorAll('tr.order-hit').forEach(t => t.classList.remove('order-hit'));
        document.querySelectorAll(`tr[data-order-id="${orderId}"]`).forEach(t => t.classList.add('order-hit'));
        showToast(`已高亮订单 ${orderId} 的所有分账行`, 'ok');
    }

    // ============================ 详情抽屉 & Waterfall ============================

    function openDetailDrawer(rebateId) {
        const r = mockRebates.find(x => x.rebateId === rebateId);
        if (!r) return;
        const meta = ORDER_META[r.orderId];
        const trader = PEOPLE[meta.traderUid];

        document.getElementById('d-rebate-id').textContent = r.rebateId;
        document.getElementById('d-status-badge').innerHTML = statusBadge(r.status);

        // Waterfall（上级链）
        const chainHtml = meta.uplineChain.slice(0, 3).map((n, i) => {
            const isCurrent = n.ibUid === r.ibUid;
            const p = PEOPLE[n.ibUid];
            const layerNo = i + 1;
            const prevPct = i === 0 ? 0 : meta.uplineChain[i - 1].pct;
            const delta = (n.pct - prevPct).toFixed(2);
            const nominal = (meta.lots * meta.spread * (n.pct - prevPct) / 100 * (meta.symbol === "XAUUSD" ? 10 : (meta.symbol === "USOIL" ? 33.33 : 8))).toFixed(2);
            return `<div class="waterfall-node ${isCurrent ? 'is-current' : ''} pl-4 pr-3 py-2.5 flex items-center gap-2">
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 text-xs">
                        <span class="text-slate-400">Tier ${layerNo}</span>
                        ${levelBadge(n.level)}
                        <span class="font-mono text-slate-700">${n.ibUid}</span>
                        <span class="text-slate-500 truncate">${p ? p.nick : ''}</span>
                        ${isCurrent ? '<span class="text-primary text-[10px] font-bold ml-1">★ 本行</span>' : ''}
                    </div>
                    <div class="text-[11px] text-slate-500 mt-1 font-mono">
                        ${n.pct.toFixed(2)}% ${i > 0 ? `- ${prevPct.toFixed(2)}%` : ''} = <span class="text-slate-700 font-semibold">${delta}%</span>
                    </div>
                </div>
                <div class="text-right font-mono text-sm text-slate-700 font-semibold">$${nominal}</div>
            </div>`;
        }).join('');

        // 金额推导
        const fxLine = r.fxPair
            ? `<div class="flex items-center justify-between text-xs py-1.5"><span class="text-slate-500">汇率换算 (${r.fxPair} @ ${r.fxRate})</span><span class="font-mono text-slate-700">${fmtNum(r.nominalUsdRaw)} → ${fmtNum(r.nominalUsd)}</span></div>`
            : '';

        // 关联流水
        const ledgerLine = r.relatedLedger
            ? `<a href="资金流水.html?tx=${r.relatedLedger}" class="text-primary hover:underline font-mono text-sm">${r.relatedLedger} <i class="fa-solid fa-arrow-right text-[10px]"></i></a>`
            : `<span class="text-slate-400 text-xs italic">${'待入账'}</span>`;

        // 冻结附加说明
        let extraSection = '';
        if (r.status === 'frozen' && r.frozenReason) {
            extraSection = `<div class="px-6 py-4 border-b border-slate-100 bg-slate-50/50">
                <div class="text-[11px] tracking-wider font-semibold text-slate-500 mb-2">冻结原因</div>
                <div class="text-sm text-slate-700">${r.frozenReason}</div>
            </div>`;
        }

        // 时间线
        const timelineHtml = `
            <div class="flex items-start gap-3">
                <span class="timeline-dot mt-1.5"></span>
                <div class="flex-1"><div class="text-sm text-slate-700">订单平仓</div><div class="text-xs text-slate-500 font-mono mt-0.5">${meta.closeTime}</div></div>
            </div>
            ${r.status === 'settled' ? `
            <div class="flex items-start gap-3 mt-3">
                <span class="timeline-dot mt-1.5"></span>
                <div class="flex-1"><div class="text-sm text-slate-700">资金入账</div><div class="text-xs text-slate-500 font-mono mt-0.5">${r.settleTime}</div></div>
            </div>` : `
            <div class="flex items-start gap-3 mt-3">
                <span class="timeline-dot pending mt-1.5"></span>
                <div class="flex-1"><div class="text-sm text-slate-700">${r.status === 'frozen' ? '已冻结' : '待入账'}</div><div class="text-xs text-slate-400 mt-0.5">${r.status === 'settled' ? '' : STATUS_META[r.status].label}</div></div>
            </div>`}
        `;

        document.getElementById('drawer-body').innerHTML = `
            <div class="px-6 py-4 border-b border-slate-100">
                <div class="text-[11px] tracking-wider font-semibold text-slate-500 mb-3">来源订单快照</div>
                <div class="grid grid-cols-2 gap-x-4 gap-y-2 text-sm">
                    <div class="text-slate-500">订单号</div><div class="font-mono text-slate-800">${r.orderId}</div>
                    <div class="text-slate-500">交易账号</div><div class="font-mono text-slate-800">Acct.No ${meta.acctNo}</div>
                    <div class="text-slate-500">账号组</div><div class="font-mono text-slate-700">${meta.traderGroup}</div>
                    <div class="text-slate-500">Symbol · 手数</div><div class="font-mono text-slate-800">${meta.symbol} · ${fmtNum(meta.lots, 2)}</div>
                    <div class="text-slate-500">Group Spread</div><div class="font-mono text-slate-700">${meta.groupPts} pts</div>
                    <div class="text-slate-500">Bridge Spread</div><div class="font-mono text-slate-700">${meta.bridgePts} pts</div>
                    <div class="text-slate-500">Raw Spread</div><div class="font-mono text-slate-700">${meta.rawPts} pts</div>
                    <div class="text-slate-500">Total Spread</div><div class="font-mono font-bold text-slate-900">${meta.spread} pts</div>
                    <div class="text-slate-500">平仓时间</div><div class="font-mono text-slate-500">${meta.closeTime}</div>
                </div>
            </div>

            <div class="px-6 py-4 border-b border-slate-100">
                <div class="text-[11px] tracking-wider font-semibold text-slate-500 mb-3">上级链推导 · Waterfall</div>
                <div class="border border-slate-200 rounded-lg overflow-hidden divide-y divide-slate-100 bg-white">
                    <div class="px-4 py-2.5 bg-slate-50 flex items-center gap-2 text-xs">
                        <span class="text-slate-400">Trader</span>
                        <span class="font-mono text-slate-700">${meta.traderUid}</span>
                        <span class="text-slate-500">${trader ? trader.nick : ''}</span>
                    </div>
                    ${chainHtml}
                </div>
            </div>

            <div class="px-6 py-4 border-b border-slate-100">
                <div class="text-[11px] tracking-wider font-semibold text-slate-500 mb-3">本行金额推导</div>
                <div class="space-y-1.5 text-sm">
                    <div class="flex items-center justify-between py-1"><span class="text-slate-500">差额百分比</span><span class="font-mono text-slate-700">${fmtNum(r.deltaPct, 2)}%</span></div>
                    <div class="flex items-center justify-between py-1"><span class="text-slate-500">${r.fxPair ? '名义返佣 (原币种)' : '名义返佣'}</span><span class="font-mono text-slate-700">${r.fxPair ? fmtNum(r.nominalUsdRaw) : fmtNum(r.nominalUsd)}</span></div>
                    ${fxLine}
                    <div class="flex items-center justify-between py-1"><span class="text-slate-500">截断损失 (2 位精度)</span><span class="font-mono text-slate-500">-${fmtNum(r.truncLoss)}</span></div>
                    <div class="border-t border-slate-200 mt-2 pt-2 flex items-center justify-between"><span class="text-sm font-semibold text-slate-700">净入账</span><span class="font-mono font-bold text-emerald-600 text-base">"+${fmtNum(r.netUsd)} <span class="text-slate-500 font-semibold">${r.currency}</span></span></div>
                </div>
            </div>

            <div class="px-6 py-4 border-b border-slate-100">
                <div class="text-[11px] tracking-wider font-semibold text-slate-500 mb-3">关联资金流水</div>
                ${ledgerLine}
            </div>

            ${extraSection}

            <div class="px-6 py-4">
                <div class="text-[11px] tracking-wider font-semibold text-slate-500 mb-3">审计时间线</div>
                ${timelineHtml}
            </div>
        `;

        document.getElementById('drawer-backdrop').classList.remove('hidden-state');
        requestAnimationFrame(() => {
            document.getElementById('drawer-backdrop').style.opacity = '1';
            document.getElementById('drawer-detail').classList.add('open');
        });
    }
    function closeDetailDrawer() {
        document.getElementById('drawer-backdrop').style.opacity = '0';
        document.getElementById('drawer-detail').classList.remove('open');
        setTimeout(() => { document.getElementById('drawer-backdrop').classList.add('hidden-state'); }, 300);
    }

    // ============================ 其它 ============================

    function exportCsv() { showToast('CSV 导出已排队（原型示意）', 'ok'); }

    function showToast(msg, kind) {
        const t = document.getElementById('toast');
        const i = document.getElementById('toast-icon');
        const m = document.getElementById('toast-msg');
        m.textContent = msg;
        i.className = kind === 'ok' ? 'fa-solid fa-check-circle text-emerald-500' : 'fa-solid fa-circle-info text-primary';
        t.classList.remove('hidden-state');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => t.classList.add('hidden-state'), 2500);
    }

    // ============================ URL 参数联动 ============================

    const params = new URLSearchParams(location.search);
    if (params.get('rebate_id')) {
        setTimeout(() => openDetailDrawer(params.get('rebate_id')), 100);
    }
    if (params.get('ib_uid')) document.getElementById('f-ib').value = params.get('ib_uid');
    if (params.get('order_id')) document.getElementById('f-order').value = params.get('order_id');

    // ============================ 初始渲染 ============================
    renderTable();
    </script>
<script src="../cms-assets/cms-embed.js?v=20261102-bi1"></script>
<script src="../cms-assets/cms-i18n-data.js?v=20261102-bi1"></script>
<script src="../cms-assets/cms-i18n.js?v=20261102-bi1"></script>
