<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copytrading 等级配置 - CFD 业务管理后台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        sidebar: '#0B1120',
                        sidebarHover: '#1E293B',
                        primary: '#3B82F6',
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .submenu-container {
            transition: max-height 0.3s ease-in-out, opacity 0.3s ease-in-out;
            max-height: 0; opacity: 0; overflow: hidden;
        }
        .submenu-container.expanded { max-height: 1000px; opacity: 1; }
        .chevron { transition: transform 0.3s ease; }
        .chevron.rotated { transform: rotate(90deg); }

        .menu-level-1 { padding-left: 1rem; }
        .menu-level-2 { padding-left: 2.75rem; }
        .menu-level-3 { padding-left: 4.5rem; }
        .menu-level-4 { padding-left: 6.25rem; }

        .toast { transition: transform .3s ease, opacity .3s ease; transform: translateY(20px); opacity: 0; }
        .toast.show { transform: translateY(0); opacity: 1; }

        .drawer-backdrop { transition: opacity .25s ease; }
        .drawer-panel { transition: transform .3s ease; transform: translateX(100%); }
        .drawer-panel.open { transform: translateX(0); }

        .modal-backdrop { transition: opacity .2s ease; }
        .modal-box { transition: transform .2s ease, opacity .2s ease; }
    </style>
<link rel="stylesheet" href="../cms-assets/cms-embed.css?v=20261102-bi1">
</head>
<body class="bg-slate-50 text-slate-900 h-screen overflow-hidden flex font-sans">

<div id="sidebar-root"></div>

<!-- 主内容区 -->
<main class="flex-1 flex flex-col overflow-hidden">

    <!-- 顶部 Header -->
    <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 shrink-0">
        <div class="flex items-center text-sm text-slate-500">
            <i class="fa-solid fa-house mr-2"></i>
            <span>Copytrading</span>
            <i class="fa-solid fa-chevron-right mx-2 text-[10px] text-slate-400"></i>
            <span class="text-slate-700 font-medium" data-i18n="breadcrumb_page">等级配置</span>
        </div>
        <div class="flex items-center gap-4">
            <div id="lang-switch"></div>
            <button class="text-slate-500 hover:text-primary transition-colors relative">
                <i class="fa-solid fa-bell"></i>
                <span class="absolute -top-1 -right-1 w-2 h-2 bg-rose-500 rounded-full"></span>
            </button>
            <button class="text-slate-500 hover:text-primary text-sm transition-colors">
                <i class="fa-solid fa-right-from-bracket mr-1"></i><span data-i18n="logout">退出</span>
            </button>
        </div>
    </header>

    <!-- 业务内容 -->
    <div class="flex-1 overflow-auto p-8 bg-slate-50">

        <!-- 页面标题 -->
        <div class="flex items-start justify-between mb-6">
            <div>
                <h1 class="text-2xl font-bold text-slate-800" data-i18n="page_title">Copytrading 等级配置</h1>
                <p class="text-sm text-slate-500 mt-2" data-i18n="page_desc">第一期仅配置 L1 高手准入门槛；等级升降级体系将在后续阶段开放。</p>
                <p class="text-xs text-rose-700 mt-2" data-i18n="change_note">本次更新：分润比例仅影响新建立的跟随关系；已有关系沿用创建时固化的比例。</p>
            </div>
            <div class="flex items-center gap-2">
                <button disabled onclick="openDrawer('add')" class="bg-slate-200 text-slate-400 text-sm font-semibold px-4 py-2 rounded-lg cursor-not-allowed">
                    <i class="fa-solid fa-plus mr-1.5"></i><span data-i18n="btn_add_level">新增等级</span>
                </button>
            </div>
        </div>

        <!-- 等级表格 -->
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="bg-slate-50/80 border-b border-slate-200">
                            <th class="text-left px-4 py-3 font-semibold text-slate-600" data-i18n="th_tier">等级</th>
                            <th class="text-left px-4 py-3 font-semibold text-slate-600" data-i18n="th_name">名称</th>
                            <th class="text-right px-4 py-3 font-semibold text-slate-600" data-i18n="th_balance">余额门槛 (USD)</th>
                            <th class="text-right px-4 py-3 font-semibold text-slate-600" data-i18n="th_trades">30D 交易次数</th>
                            <th class="text-right px-4 py-3 font-semibold text-slate-600" data-i18n="th_roi">30D 收益率</th>
                            <th class="text-right px-4 py-3 font-semibold text-slate-600" data-i18n="th_followers">跟随者数上限</th>
                            <th class="text-right px-4 py-3 font-semibold text-slate-600" data-i18n="th_profit_share">分润比例</th>
                            <th class="text-right px-4 py-3 font-semibold text-slate-600" data-i18n="th_max_capacity">Max Capacity (USD)</th>
                            <th class="text-center px-4 py-3 font-semibold text-slate-600" data-i18n="th_master_count">当前高手数</th>
                            <th class="text-center px-4 py-3 font-semibold text-slate-600" data-i18n="th_actions">操作</th>
                        </tr>
                    </thead>
                    <tbody id="levelTableBody"></tbody>
                </table>
            </div>
        </div>



    </div>
</main>

<!-- 新增/编辑抽屉 -->
<div id="drawerBackdrop" class="drawer-backdrop fixed inset-0 bg-black/40 z-40 hidden opacity-0" onclick="closeDrawer()"></div>
<div id="drawerPanel" class="drawer-panel fixed top-0 right-0 h-full w-[560px] bg-white shadow-2xl z-50 flex flex-col">
    <div class="shrink-0 px-6 py-4 border-b border-slate-200 flex items-center justify-between">
        <h2 class="text-lg font-bold text-slate-800" id="drawerTitle" data-i18n="drawer_title_add">新增等级</h2>
        <button onclick="closeDrawer()" class="text-slate-400 hover:text-slate-600 transition-colors">
            <i class="fa-solid fa-xmark text-lg"></i>
        </button>
    </div>
    <div class="flex-1 overflow-y-auto p-6 space-y-5">
        <!-- 等级 -->
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5" data-i18n="field_tier">等级</label>
            <input id="f-tier" type="text" readonly class="w-full bg-slate-100 border border-slate-200 rounded-lg px-3 py-2 text-sm text-slate-500 cursor-not-allowed">
        </div>
        <!-- 等级名称 (英语) -->
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5"><span data-i18n="field_name_en">等级名称 (English)</span> <span class="text-rose-500">*</span></label>
            <input id="f-name-en" type="text" placeholder="e.g. Gold" class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm">
        </div>
        <!-- 等级名称 (阿拉伯语) -->
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5"><span data-i18n="field_name_ar">等级名称 (العربية)</span> <span class="text-rose-500">*</span></label>
            <input id="f-name-ar" type="text" placeholder="مثال: ذهبي" dir="rtl" class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm">
        </div>
        <!-- 余额门槛 -->
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5"><span data-i18n="field_balance">余额门槛 (USD)</span> <span class="text-rose-500">*</span></label>
            <input id="f-balance" type="number" min="0" class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm font-mono">
        </div>
        <!-- 30D 交易次数 -->
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5"><span data-i18n="field_trades">30D 交易次数</span> <span class="text-rose-500">*</span></label>
            <input id="f-trades" type="number" min="0" class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm font-mono">
        </div>
        <!-- 30D 收益率 -->
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5"><span data-i18n="field_roi">30D 收益率 (%)</span> <span class="text-rose-500">*</span></label>
            <input id="f-roi" type="number" min="0" step="0.01" class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm font-mono">
        </div>
        <!-- 跟随者数上限 -->
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5"><span data-i18n="field_followers">跟随者数上限</span> <span class="text-rose-500">*</span></label>
            <input id="f-followers" type="number" min="1" step="1" class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm font-mono">
            <p class="text-xs text-slate-400 mt-1" data-i18n="field_followers_hint">限制该高手当前上榜周期内可同时保留的有效跟随关系数量</p>
        </div>
        <!-- 分润比例 -->
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5"><span data-i18n="field_profit_share">分润比例 (%)</span> <span class="text-rose-500">*</span></label>
            <input id="f-profitShare" type="number" min="0" max="100" step="0.1" class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm font-mono">
            <p class="text-xs text-rose-700 mt-1" data-i18n="field_profit_share_hint">更新：跟随关系创建时固化比例；修改配置不改变已有关系的后续分润。</p>
        </div>
        <!-- 最大可投资金额 -->
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5"><span data-i18n="field_max_capacity">最大可投资金额 (USD)</span> <span class="text-rose-500">*</span></label>
            <input id="f-maxCapacity" type="number" min="0" class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm font-mono">
            <p class="text-xs text-slate-400 mt-1" data-i18n="field_max_capacity_hint">该等级高手可接受的最大投资总额</p>
        </div>
    </div>
    <div class="shrink-0 px-6 py-4 border-t border-slate-200 flex items-center justify-end gap-3">
        <button onclick="closeDrawer()" class="px-4 py-2 text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors" data-i18n="btn_cancel">取消</button>
        <button onclick="saveLevel()" class="px-4 py-2 text-sm font-semibold text-white bg-primary hover:bg-blue-600 rounded-lg transition-colors" data-i18n="btn_save">保存</button>
    </div>
</div>

<!-- 删除确认弹窗 -->
<div id="deleteModal" class="fixed inset-0 z-50 hidden">
    <div class="modal-backdrop absolute inset-0 bg-black/40" onclick="closeDeleteModal()"></div>
    <div class="modal-box absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-white rounded-xl shadow-2xl w-[420px] p-6">
        <div class="flex items-center gap-3 mb-4">
            <div class="w-10 h-10 rounded-full bg-rose-100 flex items-center justify-center">
                <i class="fa-solid fa-triangle-exclamation text-rose-500"></i>
            </div>
            <h3 class="text-lg font-bold text-slate-800" data-i18n="delete_title">确认删除</h3>
        </div>
        <p class="text-sm text-slate-600 mb-6" id="deleteMsg" data-i18n="delete_msg">确认删除该等级？</p>
        <div class="flex items-center justify-end gap-3">
            <button onclick="closeDeleteModal()" class="px-4 py-2 text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors" data-i18n="btn_cancel">取消</button>
            <button onclick="confirmDelete()" class="px-4 py-2 text-sm font-semibold text-white bg-rose-500 hover:bg-rose-600 rounded-lg transition-colors" data-i18n="btn_delete">确认删除</button>
        </div>
    </div>
</div>

<!-- Toast -->
<div id="toast" class="toast fixed bottom-6 right-6 z-[60] bg-slate-800 text-white text-sm px-4 py-2.5 rounded-lg shadow-lg"></div>

<script src="sidebar.js?v=202607230500"></script>
<script src="lang-switch.js?v=202607241800"></script>
<script>
// ── i18n ──
const LANG = () => localStorage.getItem('cfd-lang') || 'zh';
const isZh = () => LANG() === 'zh';

const I18N = {
    breadcrumb_page: { zh: '等级配置', en: 'Level Configuration' },
    logout: { zh: '退出', en: 'Logout' },
    page_title: { zh: 'Copytrading 等级配置', en: 'Copytrading Level Configuration' },
    page_desc: { zh: '第一期仅配置 L1 高手准入门槛；等级升降级体系将在后续阶段开放。', en: 'Phase 1 configures only the L1 master admission threshold; tier promotion and demotion will be introduced in a later phase.' },
    change_note: { zh: '本次更新：分润比例仅影响新建立的跟随关系；已有关系沿用创建时固化的比例。', en: 'Updated: the rate applies only to new copy relationships. Existing relationships retain their locked rate.' },
    btn_add_level: { zh: '一期仅配置 L1', en: 'Phase 1: L1 Only' },
    th_tier: { zh: '等级', en: 'Tier' },
    th_name: { zh: '名称', en: 'Name' },
    th_balance: { zh: '余额门槛 (USD)', en: 'Balance (USD)' },
    th_trades: { zh: '30D 交易次数', en: '30D Trades' },
    th_roi: { zh: '30D 收益率', en: '30D ROI' },
    th_followers: { zh: '跟随者数上限', en: 'Followers Limit' },
    th_profit_share: { zh: '分润比例', en: 'Profit Share' },
    th_max_capacity: { zh: '最大可投资金额 (USD)', en: 'Max Capacity (USD)' },
    th_master_count: { zh: '当前高手数', en: 'Masters' },
    th_actions: { zh: '操作', en: 'Actions' },
    drawer_title_add: { zh: '新增等级', en: 'Add Level' },
    drawer_title_edit: { zh: '编辑等级', en: 'Edit Level' },
    field_tier: { zh: '等级', en: 'Tier' },
    field_name_en: { zh: '等级名称 (English)', en: 'Level Name (English)' },
    field_name_ar: { zh: '等级名称 (العربية)', en: 'Level Name (العربية)' },
    ph_name_en: { zh: 'e.g. Gold', en: 'e.g. Gold' },
    ph_name_ar: { zh: 'مثال: ذهبي', en: 'مثال: ذهبي' },
    field_balance: { zh: '余额门槛 (USD)', en: 'Balance Threshold (USD)' },
    field_trades: { zh: '30D 交易次数', en: '30D Trades' },
    field_roi: { zh: '30D 收益率 (%)', en: '30D ROI (%)' },
    field_followers: { zh: '跟随者数上限', en: 'Followers Limit' },
    field_followers_hint: { zh: '限制该高手当前上榜周期内可同时保留的有效跟随关系数量', en: 'Maximum active copy relationships during this listing period' },
    field_profit_share: { zh: '分润比例 (%)', en: 'Profit Share (%)' },
    field_profit_share_hint: { zh: '更新：跟随关系创建时固化比例；修改配置不改变已有关系的后续分润。', en: 'Updated: the rate is locked when a copy relationship starts; later configuration changes do not affect it.' },
    field_max_capacity: { zh: '最大可投资金额 (USD)', en: 'Max Capacity (USD)' },
    field_max_capacity_hint: { zh: '该等级高手可接受的最大投资总额', en: 'Maximum total investment for this level' },
    btn_cancel: { zh: '取消', en: 'Cancel' },
    btn_save: { zh: '保存', en: 'Save' },
    btn_edit: { zh: '编辑', en: 'Edit' },
    btn_delete: { zh: '删除', en: 'Delete' },
    btn_delete_disabled: { zh: '一期不可删除', en: 'Deletion unavailable in Phase 1' },
    delete_title: { zh: '确认删除', en: 'Confirm Delete' },
    delete_msg: { zh: '确认删除该等级？', en: 'Delete this level?' },
    delete_has_master: { zh: '该等级下有 {n} 位存续高手，确认删除？', en: 'There are {n} active masters under this level. Confirm delete?' },
    toast_saved: { zh: '保存成功', en: 'Saved' },
    toast_deleted: { zh: '已删除', en: 'Deleted' },
    toast_err_increment: { zh: '校验失败：等级指标必须严格递增', en: 'Validation failed: metrics must be strictly increasing' },
    toast_l1_only: { zh: '第一期仅支持配置 L1 等级', en: 'Phase 1 supports L1 configuration only' },
    toast_err_capacity: { zh: '请输入有效的最大可投资金额', en: 'Please enter a valid Max Capacity' },
    toast_err_followers: { zh: '跟随者数上限必须为不小于 1 的整数', en: 'Followers Limit must be an integer of at least 1' },
};

function t(key) {
    const entry = I18N[key];
    return entry ? entry[LANG()] || entry.zh : key;
}

function applyI18n() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        const val = t(key);
        if (val) el.innerHTML = val;
    });
    document.querySelectorAll('[data-i18n-ph]').forEach(el => {
        const key = el.getAttribute('data-i18n-ph');
        const val = t(key);
        if (val) el.placeholder = val;
    });
}

// ── Mock Data ──
const mockLevels = [
    { tier: 'Level 1', name: '黄金', nameEn: 'Gold', nameAr: 'ذهبي', balance: 1000, trades: 20, roi: 5, followers: 1000, profitShare: 20, maxCapacity: 500000, masterCount: 42 },
];

// ── Render ──
function renderLevelTable() {
    const tbody = document.getElementById('levelTableBody');
    tbody.innerHTML = mockLevels.map((lv, i) => {
        return `
        <tr class="border-b border-slate-100 hover:bg-slate-50/60 transition-colors">
            <td class="px-4 py-3">
                <span class="inline-flex items-center px-2.5 py-1 rounded-md text-[11px] font-bold tracking-wide ${i === 0 ? 'bg-slate-100 text-slate-600' : i === 1 ? 'bg-sky-50 text-sky-700' : 'bg-emerald-50 text-emerald-700'}">${lv.tier}</span>
            </td>
            <td class="px-4 py-3 font-medium text-slate-800">${lv.nameEn}</td>
            <td class="px-4 py-3 text-right font-mono">${lv.balance.toLocaleString()}</td>
            <td class="px-4 py-3 text-right font-mono">${lv.trades}</td>
            <td class="px-4 py-3 text-right font-mono">${lv.roi}%</td>
            <td class="px-4 py-3 text-right font-mono">${lv.followers}</td>
            <td class="px-4 py-3 text-right">
                <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-bold ${lv.profitShare >= 25 ? 'bg-emerald-50 text-emerald-700' : lv.profitShare >= 20 ? 'bg-sky-50 text-sky-700' : 'bg-slate-100 text-slate-600'}">${lv.profitShare}%</span>
            </td>
            <td class="px-4 py-3 text-right font-mono">${lv.maxCapacity.toLocaleString()}</td>
            <td class="px-4 py-3 text-center font-mono font-semibold text-slate-700">${lv.masterCount}</td>
            <td class="px-4 py-3 text-center">
                <div class="flex items-center justify-center gap-1">
                    <button onclick="openDrawer('edit', ${i})" class="text-primary hover:underline font-medium text-xs">${t('btn_edit')}</button>
                    <span class="text-slate-300 mx-1">|</span>
                    <span class="text-slate-400 text-xs cursor-not-allowed" title="${t('toast_l1_only')}">${t('btn_delete_disabled')}</span>
                </div>
            </td>
        </tr>`;
    }).join('');
}

// ── Drawer ──
let drawerMode = 'add';
let drawerEditIndex = -1;

function openDrawer(mode, index) {
    if (mode === 'add') {
        showToast(t('toast_l1_only'));
        return;
    }
    drawerMode = mode;
    drawerEditIndex = index ?? -1;

    const titleKey = mode === 'add' ? 'drawer_title_add' : 'drawer_title_edit';
    document.getElementById('drawerTitle').textContent = t(titleKey);

    if (mode === 'edit' && index >= 0) {
        const lv = mockLevels[index];
        document.getElementById('f-tier').value = lv.tier;
        document.getElementById('f-name-en').value = lv.nameEn;
        document.getElementById('f-name-ar').value = lv.nameAr;
        document.getElementById('f-balance').value = lv.balance;
        document.getElementById('f-trades').value = lv.trades;
        document.getElementById('f-roi').value = lv.roi;
        document.getElementById('f-followers').value = lv.followers || '';
        document.getElementById('f-profitShare').value = lv.profitShare;
        document.getElementById('f-maxCapacity').value = lv.maxCapacity;
    } else {
        const nextTier = `Level ${mockLevels.length + 1}`;
        document.getElementById('f-tier').value = nextTier;
        document.getElementById('f-name-en').value = '';
        document.getElementById('f-name-ar').value = '';
        document.getElementById('f-balance').value = '';
        document.getElementById('f-trades').value = '';
        document.getElementById('f-roi').value = '';
        document.getElementById('f-followers').value = '';
        document.getElementById('f-profitShare').value = '';
        document.getElementById('f-maxCapacity').value = '';
    }

    const bd = document.getElementById('drawerBackdrop');
    const pn = document.getElementById('drawerPanel');
    bd.classList.remove('hidden');
    requestAnimationFrame(() => { bd.classList.add('opacity-100'); pn.classList.add('open'); });
}

function closeDrawer() {
    const bd = document.getElementById('drawerBackdrop');
    const pn = document.getElementById('drawerPanel');
    bd.classList.remove('opacity-100');
    pn.classList.remove('open');
    setTimeout(() => bd.classList.add('hidden'), 300);
}

// ── Save ──
function saveLevel() {
    if (drawerMode === 'add') {
        showToast(t('toast_l1_only'));
        return;
    }
    const nameEn = document.getElementById('f-name-en').value.trim();
    const nameAr = document.getElementById('f-name-ar').value.trim();
    const balance = parseFloat(document.getElementById('f-balance').value) || 0;
    const trades = parseInt(document.getElementById('f-trades').value) || 0;
    const roi = parseFloat(document.getElementById('f-roi').value) || 0;
    const followers = parseInt(document.getElementById('f-followers').value, 10);
    const profitShare = parseFloat(document.getElementById('f-profitShare').value) || 0;
    const maxCapacity = parseFloat(document.getElementById('f-maxCapacity').value) || 0;
    const tier = document.getElementById('f-tier').value;

    if (!nameEn) { showToast(isZh() ? '请输入英文名称' : 'Please enter English name'); return; }
    if (!nameAr) { showToast(isZh() ? '请输入阿拉伯语名称' : 'Please enter Arabic name'); return; }

    if (!Number.isInteger(followers) || followers < 1) { showToast(t('toast_err_followers')); return; }

    // Increment validation (compare with previous level)
    if (drawerEditIndex > 0) {
        const prev = mockLevels[drawerEditIndex - 1];
        if (balance <= prev.balance || trades <= prev.trades || roi <= prev.roi || profitShare <= prev.profitShare) {
            showToast(t('toast_err_increment'));
            return;
        }
    }
    // Also check next level
    if (drawerEditIndex >= 0 && drawerEditIndex < mockLevels.length - 1) {
        const next = mockLevels[drawerEditIndex + 1];
        if (balance >= next.balance || trades >= next.trades || roi >= next.roi || profitShare >= next.profitShare) {
            showToast(t('toast_err_increment'));
            return;
        }
    }

    if (drawerMode === 'edit' && drawerEditIndex >= 0) {
        const lv = mockLevels[drawerEditIndex];
        lv.nameEn = nameEn;
        lv.nameAr = nameAr;
        lv.balance = balance;
        lv.trades = trades;
        lv.roi = roi;
        lv.followers = followers;
        lv.profitShare = profitShare;
        lv.maxCapacity = maxCapacity;
    } else {
        mockLevels.push({
            tier, nameEn, nameAr, balance, trades, roi,
            followers,
            profitShare, maxCapacity, masterCount: 0
        });
    }

    closeDrawer();
    renderLevelTable();
    showToast(t('toast_saved'));
}

// ── Delete ──
let deleteTargetIndex = -1;

function openDeleteModal(index) {
    deleteTargetIndex = index;
    const lv = mockLevels[index];
    const msgKey = lv.masterCount > 0 ? 'delete_has_master' : 'delete_msg';
    let msg = t(msgKey);
    if (lv.masterCount > 0) msg = msg.replace('{n}', lv.masterCount);
    document.getElementById('deleteMsg').textContent = msg;
    document.getElementById('deleteModal').classList.remove('hidden');
}

function closeDeleteModal() {
    document.getElementById('deleteModal').classList.add('hidden');
    deleteTargetIndex = -1;
}

function confirmDelete() {
    if (deleteTargetIndex === 0 || mockLevels.length <= 1) {
        showToast(t('toast_l1_only'));
        closeDeleteModal();
        return;
    }
    if (deleteTargetIndex >= 0) {
        mockLevels.splice(deleteTargetIndex, 1);
        // Re-index tiers
        mockLevels.forEach((lv, i) => { lv.tier = `Level ${i + 1}`; });
        renderLevelTable();
        showToast(t('toast_deleted'));
    }
    closeDeleteModal();
}

// ── Toast ──
function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2500);
}

// ── Init ──
function init() {
    const lang = LANG();
    injectSidebar({ activePath: isZh() ? 'Copytrading / 等级配置' : 'Copytrading / Level Configuration', lang });
    applyI18n();
    renderLevelTable();
}
init();
