<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>需求管理提交页</title>
  <link rel="icon" type="image/svg+xml" href="/admin/requirements-icon.svg?v=1">
  <style>
    :root {
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-soft: #f9fafb;
      --line: #d9e1e8;
      --line-strong: #c8d3dd;
      --text: #17212b;
      --muted: #65758a;
      --primary: #1769e0;
      --primary-dark: #1052b3;
      --primary-soft: #eaf2ff;
      --green: #16794c;
      --green-soft: #e8f6ee;
      --amber: #9a650f;
      --amber-soft: #fff7e8;
      --red: #c9362e;
      --red-soft: #fff0ef;
      --shadow: 0 12px 30px rgba(24, 39, 56, .08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 1180px;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      font-size: 14px;
      letter-spacing: 0;
    }

    button, input, select, textarea { font: inherit; }

    .app {
      display: grid;
      grid-template-columns: 228px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      padding: 18px 14px;
      background: #17212b;
      color: #dce6ee;
    }

    .brand {
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      margin-bottom: 26px;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 7px;
      background: var(--primary);
      color: #fff;
      font-weight: 800;
    }

    .brand-title {
      font-weight: 760;
      line-height: 1.2;
    }

    .brand-sub {
      margin-top: 2px;
      color: #9fb0bf;
      font-size: 12px;
    }

    .nav-label {
      margin: 18px 8px 8px;
      color: #8fa1b1;
      font-size: 12px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      min-height: 38px;
      margin-bottom: 4px;
      padding: 8px 10px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #dce6ee;
      text-align: left;
      cursor: pointer;
    }

    .nav-item.is-active {
      background: #263849;
      color: #fff;
    }

    .nav-icon {
      display: grid;
      place-items: center;
      width: 18px;
      height: 18px;
      color: #b7c6d2;
      font-size: 13px;
      font-weight: 700;
    }

    .content {
      min-width: 0;
      padding: 20px 24px 36px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      line-height: 1.25;
      font-weight: 760;
    }

    .subtext {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 34px;
      padding: 7px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: #24313d;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn:hover { border-color: var(--line-strong); }
    .btn.primary { border-color: var(--primary); background: var(--primary); color: #fff; }
    .btn.primary:hover { background: var(--primary-dark); }
    .btn.danger { border-color: var(--red); color: var(--red); }
    .btn.ghost { border-color: transparent; background: transparent; }
    .btn.small { min-height: 30px; padding: 5px 9px; font-size: 12px; }
    .btn[disabled] { opacity: .55; cursor: not-allowed; }

    .icon {
      width: 15px;
      height: 15px;
      display: inline-block;
      position: relative;
      flex: 0 0 auto;
    }

    .icon.copy::before {
      content: "";
      position: absolute;
      inset: 3px 1px 1px 5px;
      border: 1.7px solid currentColor;
      border-radius: 2px;
    }

    .icon.copy::after {
      content: "";
      position: absolute;
      inset: 1px 5px 5px 1px;
      border: 1.7px solid currentColor;
      border-radius: 2px;
    }

    .icon.save::before {
      content: "";
      position: absolute;
      inset: 1px;
      border: 1.7px solid currentColor;
      border-radius: 2px;
    }

    .icon.save::after {
      content: "";
      position: absolute;
      left: 4px;
      right: 4px;
      bottom: 3px;
      height: 4px;
      border: 1.7px solid currentColor;
      border-bottom: 0;
    }

    .icon.download::before {
      content: "";
      position: absolute;
      left: 7px;
      top: 1px;
      width: 1.7px;
      height: 8px;
      background: currentColor;
    }

    .icon.download::after {
      content: "";
      position: absolute;
      left: 3px;
      top: 6px;
      width: 8px;
      height: 8px;
      border-left: 1.7px solid currentColor;
      border-bottom: 1.7px solid currentColor;
      transform: rotate(-45deg);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }

    .metric {
      min-height: 84px;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 1px 0 rgba(20, 36, 50, .03);
    }

    .metric-label {
      color: var(--muted);
      font-size: 12px;
    }

    .metric-value {
      margin-top: 9px;
      font-size: 22px;
      line-height: 1;
      font-weight: 760;
    }

    .metric-note {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(430px, .92fr);
      gap: 14px;
      align-items: start;
    }

    .page-view {
      display: none;
    }

    .page-view.is-active {
      display: block;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 52px;
      padding: 13px 15px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-soft);
    }

    .panel-title {
      margin: 0;
      font-size: 16px;
      font-weight: 740;
    }

    .panel-body {
      padding: 15px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 12px;
    }

    .field {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .span-2 { grid-column: span 2; }
    .span-3 { grid-column: span 3; }
    .span-4 { grid-column: span 4; }
    .span-5 { grid-column: span 5; }
    .span-6 { grid-column: span 6; }
    .span-8 { grid-column: span 8; }
    .span-12 { grid-column: span 12; }

    label {
      color: var(--muted);
      font-size: 12px;
    }

    .required::after {
      content: " *";
      color: var(--red);
    }

    input, select, textarea {
      width: 100%;
      min-height: 36px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      outline: none;
    }

    textarea {
      min-height: 94px;
      resize: vertical;
      line-height: 1.55;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(23, 105, 224, .12);
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .section-title {
      grid-column: span 12;
      margin: 4px 0 -2px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      color: #24313d;
      font-size: 13px;
      font-weight: 760;
    }

    .check-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .check-item {
      display: flex;
      align-items: center;
      gap: 7px;
      min-height: 34px;
      padding: 7px 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: #2b3743;
      font-size: 13px;
    }

    .check-item input {
      width: 15px;
      min-height: 15px;
      padding: 0;
      margin: 0;
      accent-color: var(--primary);
    }

    .preview {
      min-height: 692px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .preview-tools {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .preview-box {
      width: 100%;
      min-height: 640px;
      padding: 14px;
      border: 0;
      border-radius: 0;
      background: #101820;
      color: #e7edf4;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 12.5px;
      line-height: 1.6;
      resize: vertical;
    }

    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 10;
      display: none;
      min-width: 220px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 14px 36px rgba(24, 39, 56, .16);
      color: #24313d;
    }

    .toast.show { display: block; }

    .drawer {
      margin-top: 14px;
    }

    .history-list {
      display: grid;
      gap: 8px;
      max-height: none;
      overflow: auto;
    }

    .record-filters {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr 1fr auto;
      gap: 10px;
      align-items: end;
      margin-bottom: 12px;
    }

    .history-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
    }

    .history-title {
      font-weight: 720;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .record-edit {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: minmax(160px, 1fr) minmax(220px, 2fr) auto;
      gap: 10px;
      align-items: end;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }

    .record-edit[hidden] { display: none; }
    .record-edit .field { min-width: 0; }
    .record-edit .actions { padding-bottom: 1px; }

    @media (max-width: 760px) {
      .record-edit { grid-template-columns: 1fr; }
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 3px 7px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: #1559bf;
      font-size: 12px;
      font-weight: 680;
    }

    .badge.major {
      background: var(--amber-soft);
      color: var(--amber);
    }

    .badge.minor {
      background: var(--green-soft);
      color: var(--green);
    }

    .badge.submitted {
      background: var(--primary-soft);
      color: #1559bf;
    }

    .empty {
      padding: 18px;
      border: 1px dashed var(--line-strong);
      border-radius: 7px;
      color: var(--muted);
      text-align: center;
    }

    .conditional-fields {
      display: contents;
    }

    .conditional-fields[hidden] {
      display: none;
    }

    .badge.document {
      background: var(--amber-soft);
      color: var(--amber);
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">PRD</div>
        <div>
          <div class="brand-title">需求管理</div>
          <div class="brand-sub">AI 迭代提交台</div>
        </div>
      </div>
      <div class="nav-label">工作区</div>
      <div class="nav-item is-active" data-page="submit"><span class="nav-icon">01</span><span>提交需求</span></div>
      <div class="nav-item" data-page="records"><span class="nav-icon">02</span><span>提交记录</span></div>
      <div class="nav-label">说明</div>
      <div class="nav-item"><span class="nav-icon">AI</span><span>提交后仍需复制或导出给 Codex</span></div>
    </aside>

    <main class="content">
      <div class="topbar">
        <div>
          <h1>需求管理提交页</h1>
          <p class="subtext">用最少的信息记录一次可评审、可迭代的 MVP 需求。</p>
        </div>
        <div class="actions">
          <button class="btn" type="button" id="newBtn">新建</button>
          <button class="btn" type="button" id="saveBtn"><span class="icon save"></span>保存草稿</button>
          <button class="btn primary" type="button" id="submitBtn">提交需求</button>
          <button class="btn" type="button" id="copyBtn"><span class="icon copy"></span>复制给 AI</button>
          <button class="btn" type="button" id="downloadBtn"><span class="icon download"></span>导出 Markdown</button>
        </div>
      </div>

      <section class="summary">
        <div class="metric">
          <div class="metric-label">当前版本</div>
          <div class="metric-value" id="metricVersion">未填写</div>
          <div class="metric-note" id="metricType">等待输入</div>
        </div>
        <div class="metric">
          <div class="metric-label">需求完整度</div>
          <div class="metric-value" id="metricComplete">0%</div>
          <div class="metric-note">按必填项和核心说明估算</div>
        </div>
        <div class="metric">
          <div class="metric-label">本地记录</div>
          <div class="metric-value" id="metricDrafts">0</div>
          <div class="metric-note" id="metricRecordsNote">保存在当前浏览器</div>
        </div>
        <div class="metric">
          <div class="metric-label">下一步</div>
          <div class="metric-value" id="metricNext">方案评审</div>
          <div class="metric-note">复制右侧内容提交给 AI</div>
        </div>
      </section>

      <div class="page-view is-active" id="submitPage">
      <div class="workspace">
        <section class="panel">
          <div class="panel-head">
            <h2 class="panel-title">MVP 需求表单</h2>
            <span class="badge" id="statusBadge">草稿</span>
          </div>
          <div class="panel-body">
            <form class="form-grid" id="requirementForm">
              <div class="field span-3">
                <label class="required" for="project">所属项目</label>
                <input id="project" name="project" list="projectOptions" placeholder="例如 管理后台 / 交易后台">
                <datalist id="projectOptions">
                  <option value="管理后台"></option>
                  <option value="交易后台"></option>
                  <option value="BI 数据系统"></option>
                </datalist>
              </div>
              <div class="field span-3">
                <label class="required" for="category">需求分类</label>
                <select id="category" name="category">
                  <option value="功能需求">功能需求</option>
                  <option value="主产品文档更新">主产品文档更新</option>
                  <option value="体验优化">体验优化</option>
                  <option value="缺陷修复">缺陷修复</option>
                  <option value="技术需求">技术需求</option>
                </select>
              </div>

              <div class="conditional-fields" id="documentFields" hidden>
                <div class="section-title">文档合并</div>
                <div class="field span-6">
                  <label class="required" for="sourceDocument">上传新需求文档</label>
                  <input id="sourceFile" type="file" accept=".docx,.doc,.pdf,.md,.txt">
                  <input id="sourceDocument" name="sourceDocument" type="hidden">
                </div>
                <div class="field span-6">
                  <label for="targetDocument">目标主产品文档</label>
                  <input id="targetDocument" name="targetDocument" value="V1.0.0后台管理需求文档.docx" readonly>
                </div>
              </div>

              <div class="conditional-fields" id="standardRequirementFields">
              <div class="field span-3">
                <label class="required" for="requirementId">需求编号</label>
                <input id="requirementId" name="requirementId" placeholder="例如 REQ-20260721-01，用于关联原型和迭代记录">
              </div>
              <div class="field span-3">
                <label class="required" for="version">版本号</label>
                <input id="version" name="version" placeholder="例如 V1.3.0">
              </div>
              <div class="field span-3">
                <label class="required" for="versionType">版本类型</label>
                <select id="versionType" name="versionType">
                  <option value="">请选择</option>
                  <option value="大版本">大版本</option>
                  <option value="小版本">小版本</option>
                  <option value="补充需求">补充需求</option>
                  <option value="修订">修订</option>
                </select>
              </div>
              <div class="field span-3">
                <label for="priority">优先级</label>
                <select id="priority" name="priority">
                  <option value="P1">P1 高</option>
                  <option value="P2" selected>P2 中</option>
                  <option value="P3">P3 低</option>
                </select>
              </div>
              <div class="field span-6">
                <label for="module">所属模块</label>
                <input id="module" name="module" list="moduleOptions" placeholder="例如 交易下单 / 风控管理">
                <datalist id="moduleOptions"></datalist>
              </div>
              <div class="field span-12">
                <label class="required" for="title">需求名称</label>
                <input id="title" name="title" placeholder="例如 保证金金额反算下单手数">
              </div>

              <div class="conditional-fields" id="biRequirementFields" hidden>
                <div class="section-title">BI 迭代基线</div>
                <div class="field span-4">
                  <label for="biBaselineVersion">当前基线版本</label>
                  <input id="biBaselineVersion" name="biBaselineVersion" value="V1.4.1" readonly>
                </div>
                <div class="field span-4">
                  <label for="biChangeType">迭代类型</label>
                  <select id="biChangeType" name="biChangeType">
                    <option value="">请选择</option>
                    <option value="新增指标或页面">新增指标或页面</option>
                    <option value="指标口径调整">指标口径调整</option>
                    <option value="筛选与联动调整">筛选与联动调整</option>
                    <option value="图表与交互调整">图表与交互调整</option>
                    <option value="经营数据调整">经营数据调整</option>
                    <option value="账户角色权限调整">账户角色权限调整</option>
                    <option value="中英文与文案调整">中英文与文案调整</option>
                    <option value="性能与数据质量">性能与数据质量</option>
                  </select>
                </div>
                <div class="field span-4">
                  <label for="dataDomain">数据域</label>
                  <select id="dataDomain" name="dataDomain">
                    <option value="">请选择</option>
                    <option value="用户数据">用户数据</option>
                    <option value="出入金数据">出入金数据</option>
                    <option value="交易数据">交易数据</option>
                    <option value="资金数据">资金数据</option>
                    <option value="经营数据">经营数据</option>
                    <option value="系统管理">系统管理</option>
                  </select>
                </div>
                <div class="field span-6">
                  <label for="metricDefinition">指标与计算口径</label>
                  <textarea id="metricDefinition" name="metricDefinition" placeholder="指标名称、英文名、技术字段、业务定义、公式、UID/Account/Order 去重、状态、币种、EOD 与时间口径"></textarea>
                </div>
                <div class="field span-6">
                  <label for="dimensions">分析维度与筛选条件</label>
                  <textarea id="dimensions" name="dimensions" placeholder="例如 时间、地区、渠道、账户类型、Symbol、客户等级"></textarea>
                </div>
                <div class="field span-12">
                  <label for="preservedLogic">必须保留的第一期逻辑</label>
                  <textarea id="preservedLogic" name="preservedLogic" placeholder="说明本次不能改变的旧口径、联合筛选、权限、图表、关注、语言切换或经营计算逻辑"></textarea>
                </div>
              </div>

              <div class="section-title">需求背景与目标</div>
              <div class="field span-12">
                <label class="required" for="background">需求背景</label>
                <textarea id="background" name="background" placeholder="为什么要做这个需求？当前问题是什么？业务希望解决什么？"></textarea>
              </div>
              <div class="field span-12">
                <label class="required" for="goal">需求目标</label>
                <textarea id="goal" name="goal" placeholder="这个版本完成后，用户或运营能做到什么？成功标准是什么？"></textarea>
              </div>

              <div class="section-title">MVP 范围与核心逻辑</div>
              <div class="field span-12">
                <label class="required" for="scope">本期范围</label>
                <textarea id="scope" name="scope" placeholder="本期要交付哪些页面、能力和关键场景？不做的内容也可在这里说明。"></textarea>
              </div>
              <div class="field span-12">
                <label class="required" for="logic">主要逻辑点</label>

      currentId = data.id;

      updatePreview();

        if (Object.prototype.hasOwnProperty.call(data, item.name)) item.value = data[item.name] || "";
      });
      outputChecks.forEach(item => {
        item.checked = Array.isArray(data.outputs) && data.outputs.includes(item.value);

      updateProjectFields();
      updatePreview();
      showToast("已加载草稿");

      showToast("记录已删除");

        '"': "&quot;",
        "'": "&#039;"

      item.addEventListener("click", () => switchPage(item.dataset.page));
    });

    seedDefaultRecords();
    if (!form.elements.requirementId.value) {
      const now = new Date();
      const datePart = [now.getFullYear(), String(now.getMonth() + 1).padStart(2, "0"), String(now.getDate()).padStart(2, "0")].join("");
      form.elements.requirementId.value = `REQ-${datePart}-01`;
    }
    updateCategoryFields();
    updateProjectFields();
    renderHistory();
    updatePreview();
  </script>
</body>
</html>
